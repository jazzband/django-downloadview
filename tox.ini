[tox]
envlist =
    py{311,312,313,314}-django52
    py{312,313,314}-django60
    py{312,313,314,315}-django61
    py{312,313,314,315}-djangomain
    sphinx
    readme

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315

[gh-actions:env]
DJANGO =
    5.2: django52
    6.0: django60
    6.1: django61
    main: djangomain

[testenv]
deps =
    coverage
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    djangomain: https://github.com/django/django/archive/main.tar.gz
    pytest
    pytest-cov
commands =
    pip install -e .
    pip install -e demo
    # doctests and unit tests
    pytest --cov=django_downloadview --cov=demoproject {posargs}
    # demo project integration tests
    coverage run --append {envbindir}/demo test {posargs: demoproject}
    coverage xml
    pip freeze
ignore_outcome =
    djangomain: True

[testenv:sphinx]
deps =
    Sphinx
commands =
    pip install -e .
    make --directory=docs SPHINXOPTS='-W' clean {posargs:html doctest linkcheck}
allowlist_externals =
    make

[testenv:readme]
description = Ensure README renders on PyPI
deps =
    build
    twine
commands =
    {envpython} -m build --outdir {envtmpdir}/dist
    twine check {envtmpdir}/dist/*

[coverage:run]
source = django_downloadview,demo

[pytest]
DJANGO_SETTINGS_MODULE = demoproject.settings
addopts = --doctest-modules --ignore=docs/
python_files = tests/*.py
