[tox]
envlist =
    py{311,312,313,314}-django52-{unittest,pytest,checkmigrations}
    py{312,313,314}-django{60,61}-{unittest,pytest,checkmigrations}
    py{312,313,314}-djangomain-{unittest,pytest,checkmigrations}
    lint
    sphinx
    readme

[gh-actions]
python =
    3.11: py311, lint, sphinx, readme
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
DJANGO =
    4.2: dj42
    5.0: dj50
    5.1: dj51
    5.2: dj52
    main: djmain

[testenv]
deps =
    coverage
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    djangomain: https://github.com/django/django/archive/main.tar.gz
    pytest
    pytest-cov
commands =
    pip install -e .
    pip install -e demo
    # doctests and unit tests
    pytest --cov=django_downloadview --cov=demoproject {posargs}
    # demo project integration tests
    coverage run --append {envbindir}/demo test {posargs: demoproject}
    coverage xml
    pip freeze
ignore_outcome =
    djmain: True

[testenv:lint]
deps =
    flake8
    black
    isort
commands =
    flake8 demo django_downloadview tests
    black --check demo django_downloadview tests
    isort --check-only --recursive demo django_downloadview tests

[testenv:sphinx]
deps =
    Sphinx
commands =
    pip install -e .
    make --directory=docs SPHINXOPTS='-W' clean {posargs:html doctest linkcheck}
whitelist_externals =
    make

[testenv:readme]
description = Ensure README renders on PyPI
deps = twine
commands =
    {envpython} setup.py -q sdist bdist_wheel
    twine check dist/*

[flake8]
max-line-length = 88
ignore = E203, W503

[coverage:run]
source = django_downloadview,demo

[pytest]
DJANGO_SETTINGS_MODULE = demoproject.settings
addopts = --doctest-modules --ignore=docs/
python_files = tests/*.py
